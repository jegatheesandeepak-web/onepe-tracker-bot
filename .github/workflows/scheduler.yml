name: OnePe Tracker Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
    - cron: '37 8 * * *'
    - cron: '37 14 * * *'

jobs:
  run-tracker-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tracker bot
        env:
          TRACKER_URL: ${{ secrets.TRACKER_URL }}
          TRACKER_PIN: ${{ secrets.TRACKER_PIN }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_INSTANCE_ID: ${{ secrets.GREEN_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
        run: node index.js
